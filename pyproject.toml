[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybrid-rag-pipeline"
version = "0.1.0"
description = "Production-grade hybrid RAG: dense + sparse retrieval, RRF, verified citations, rigorous evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samir Anbri" }]
keywords = ["rag", "retrieval", "hybrid-search", "bm25", "rrf", "reranking", "langchain", "langgraph", "evaluation"]

# NOTE: lower bounds here; exact versions are locked at `make install` time
# (a lockfile / pinned set keeps builds reproducible — see meta.json discipline).
dependencies = [
  # Orchestration
  "langchain>=0.3",
  "langchain-community>=0.3",
  "langchain-anthropic>=0.2",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  # Retrieval / indexing
  "qdrant-client>=1.11",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0",   # local embeddings + cross-encoder reranker
  # LLMs / structured output
  "anthropic>=0.40",
  "openai>=1.50",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "instructor>=1.5",
  # API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  # Evaluation / stats
  # NOTE: `ragas` is intentionally NOT a dependency (ADR-0009): its LangChain LLM wrapper sets
  # `temperature` and offers no adaptive-thinking/effort surface, violating this repo's binding
  # Anthropic SDK rules (all banned params 400 on the 4.x models). Faithfulness + answer_relevancy
  # are reimplemented over the official `anthropic` SDK in `rag.eval.generation_scorers`, RAGAS
  # credited as the spec. Carrying the unused dep would be an overclaim.
  "numpy>=1.26",
  "scipy>=1.13",
  # Document loading / chunking
  "pymupdf>=1.24",      # PDF
  "python-docx>=1.1",   # Word (.docx) — common for business docs
  "tiktoken>=0.7",      # token-aware chunking
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "black>=24.8",
  "mypy>=1.11",
  # Lightweight indexing backends so the dense-store + BM25 + build-smoke tests run
  # unconditionally in CI (the suite must verify idempotency / reproducibility, not skip it).
  # NOTE: sentence-transformers/torch are intentionally NOT here — tests use HashingEmbedder.
  "qdrant-client>=1.11",
  "rank-bm25>=0.2.2",
  # FastAPI TestClient drives the API tests over the in-memory app (no live server).
  # fastapi/uvicorn/sse-starlette are already runtime deps; httpx is what TestClient needs.
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/anbsamsam17/hybrid-rag-pipeline"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]  # pyflakes, pycodestyle, isort, pyupgrade, bugbear, simplify

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true   # many ML libs ship no stubs

[tool.pytest.ini_options]
pythonpath = ["src"]   # import `rag` in tests without an editable install
testpaths = ["tests"]
addopts = "-q"
# Scoped: any future qdrant_client deprecation fails the suite loudly (the indexing path
# must not silently ride a deprecated API into a breaking minor bump). Kept narrow so
# unrelated third-party deprecations don't break the build.
filterwarnings = [
  "error::DeprecationWarning:qdrant_client",
]
